# Last.fm Scrobbler for mpv player
# Configuration file: script-opts/lastfm.conf

# ==============================================================================
# AUTHENTICATION
# ==============================================================================
# Follow these simple steps within mpv:
# 1. Start any media playback in mpv.
# 2. Run the command `script-binding scrobble/auth-start` (or press your shortcut).
#    Your default browser will open asking you to allow mpv access to Last.fm.
# 3. After clicking "Allow Access" in your browser, run `script-binding scrobble/auth-finish`.
#    Your session key will be saved to ~~/script-opts/lastfm_session.json automatically.

# Optional: Provide your own Last.fm API Key and Shared Secret.
# You can generate them for free at: https://www.last.fm/api/account/create
# If left empty, the built-in community application credentials will be used.
api_key=
api_secret=

# Optional: Manually set a session key or username if you already have one.
session_key=
username=

# ==============================================================================
# PATH WHITELIST & RULES
# ==============================================================================
# Enable scrobbling only for media located inside specific folders.
# Specify a comma-separated list of absolute paths or folder names (case-sensitive).
# e.g., scrobble_paths=D:\Music, /home/john/Music, FLAC
# Leaving this blank allows media from all locations to be scrobbled.
scrobble_paths=

# Percentage of the track that must be played before scrobbling (default: 50).
# Last.fm guidelines: tracks >= 30s scrobble after 50% or 4 minutes (240s), whichever is less.
scrobble_threshold=50

# Blacklists (comma-separated, case-sensitive exact match)
artist_blacklist=
track_blacklist=

# ==============================================================================
# METADATA EXTRACTION & OVERRIDES
# ==============================================================================
# Fuzzy search for "Artist - Album" or "Artist - Track" extracted from the filename.
# Options:
#   cue: only extract from filename if the file is a CUE sheet (default)
#   yes: extract from filename for all files if metadata is missing
#   no:  never parse filenames for metadata
fuzzy_metadata_search=cue

# Setting 'enforce_overrides' to 'yes' will force metadata from .override files
# to supersede embedded tags. (Options: yes, no)
enforce_overrides=yes

# Determines whether to scrobble using Album_Artist instead of Artist.
# Options:
#   no:   scrobbles Artist directly (default)
#   yes:  prioritizes Album_Artist; falls back to Artist if missing
#   must: strictly requires Album_Artist; skips scrobbling if missing
only_album_artist=